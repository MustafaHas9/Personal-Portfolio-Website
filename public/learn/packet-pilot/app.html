<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packet Pilot</title>
<style>
/* Dark panels around a bright, drawn scene. The scene sets --accent when it changes, so
   buttons, the meter and focus rings pick up the setting's colour. Corners stay small on
   purpose: boxy, not pilly. */
:root{
  --bg:#12161b; --panel:#1a1f26; --panel2:#222831; --line:#343c47;
  --text:#ece7da; --dim:#98a1ab;
  --accent:#e8b44c; --accent-ink:#1c1405;
  --good:#7fcf86; --bad:#ec6f64;
  --radius:8px;
  --font-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font-ui);min-height:100vh;padding:10px 14px 12px}
.shell{max-width:1560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:28px;height:28px;flex:none}
.brand h1{margin:0;font:600 1.4rem/1 var(--font-display);letter-spacing:.01em}
.hud{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.lab{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat b{font:600 1.05rem/1.1 var(--font-mono)}
.ttl{display:flex;align-items:center;gap:10px}
.meter{width:150px;height:10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--good);transition:width .45s ease,background-color .3s}
.meter.mid i{background:var(--accent)}
.meter.low i{background:var(--bad)}
.ttl b{font:600 1.15rem/1 var(--font-mono);min-width:2ch;text-align:right}
.ttl.hit b{animation:hit .5s}
@keyframes hit{30%{color:var(--bad);transform:scale(1.25)}}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:var(--radius);transition:border-color .15s,background-color .15s,scale .12s}
.btn:hover{border-color:var(--accent)}
.btn:active{scale:.96}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}

/* ---------- menu ---------- */
.menu{display:grid;gap:22px}
.menu .lead{max-width:44rem;margin:0;color:var(--dim);font-size:1.02rem}
.menu fieldset{border:0;margin:0;padding:0}
.menu legend{padding:0;margin-bottom:10px;font:600 1.05rem/1.2 var(--font-display)}
.choices{display:grid;gap:10px}
.chars{grid-template-columns:repeat(6,minmax(0,1fr))}
.modes{grid-template-columns:repeat(2,minmax(0,1fr))}
.scenes{grid-template-columns:repeat(7,minmax(0,1fr))}
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice .face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;height:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);text-align:center;transition:border-color .15s,background-color .15s}
.choice:hover .face{border-color:#566170}
.choice input:checked + .face{border-color:var(--accent);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
.choice input:focus-visible + .face{outline:2px solid var(--accent);outline-offset:2px}
.choice .face svg{width:64px;height:64px}
.choice .nm{font-weight:600}
.choice .ds{font-size:.85rem;color:var(--dim)}
.modes .face{align-items:flex-start;text-align:left;padding:14px 16px}
.scenes .face svg{width:100%;height:auto;border-radius:5px}
.go{justify-self:start;padding:12px 28px;font-size:1.05rem}
.best-line{margin:0;color:var(--dim);font-size:.9rem}

/* ---------- stage ---------- */
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
/* On a short window the map is capped so the question under it still fits without scrolling.
   Only when opened on its own: inside the Learn page the frame grows to fit, so 100vh there is
   the frame's own height and would shrink the map for no reason. */
.solo .stage{max-width:max(520px,calc((100vh - 285px) * 1.786))}
.stage svg{display:block;width:100%;height:auto}
.stage svg.enter{animation:fadein .7s ease}
@keyframes fadein{from{opacity:.15}to{opacity:1}}
.node{cursor:pointer;outline:none}
.node .ring{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:7 6;opacity:0}
.node.current .ring{opacity:1;animation:spin 14s linear infinite}
.node.inspected .ring{opacity:.55}
.node:focus-visible .ring{opacity:1;stroke-dasharray:none}
.node:hover .glyph{filter:brightness(1.08)}
@keyframes spin{to{stroke-dashoffset:-260}}
.lbl{font:700 18px var(--font-ui);fill:#fff;stroke:rgba(18,22,27,.8);stroke-width:5px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.vtag{font:700 13px var(--font-mono);fill:#fff;pointer-events:none}
/* interface names sit on the road just outside each building, so "Out Fa0/3" can be found on the map */
.ifl{font:700 16px var(--font-mono);fill:#fff;stroke:rgba(18,22,27,.85);stroke-width:5px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.beacon{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.c1{fill:var(--c1)}.c2{fill:var(--c2)}.c3{fill:var(--c3)}.c4{fill:var(--c4)}.c5{fill:var(--c5)}.c6{fill:var(--c6)}
.k1{fill:none;stroke:var(--c1)}.k2{fill:none;stroke:var(--c2)}.k3{fill:none;stroke:var(--c3)}.k5{fill:none;stroke:var(--c5)}
.pk-tag rect{fill:rgba(18,22,27,.88);stroke:var(--accent);stroke-width:1.5}
.pk-tag text{font:700 13px var(--font-mono);fill:#fff}
.pk .flip{transition:none}
.pk.walking .body{animation:bob .34s ease-in-out infinite}
.pk.walking .f1{animation:stepa .34s ease-in-out infinite}
.pk.walking .f2{animation:stepa .34s ease-in-out infinite .17s}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes stepa{50%{transform:translateY(-4px)}}
.pk .who.shake{animation:shake .45s}
.pk .who.hop{animation:hop .5s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes hop{35%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}}
.float{font:700 24px var(--font-mono);paint-order:stroke;stroke:rgba(18,22,27,.85);stroke-width:5px;stroke-linejoin:round;animation:floatup 1.3s ease-out forwards;pointer-events:none}
.float.neg{fill:#ff8277}.float.pos{fill:#9be59f}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-38px);opacity:0}}
.flag{animation:flutter 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes flutter{50%{transform:skewY(-8deg)}}
.banner{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);padding:7px 12px;border-radius:6px;
  background:rgba(18,22,27,.82);border:1px solid var(--line);font-size:.92rem;pointer-events:none}
.banner b{color:var(--accent);font-weight:600}

/* ---------- panels ---------- */
/* The map takes whatever width is left; the headers and tables are a fixed narrow column. That
   keeps the game as large as the screen allows and still on one screen. It stacks when narrow. */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.col{display:grid;gap:10px;min-width:0}
#q{min-height:10.5rem}
.card h3{margin:0 0 6px;font:600 1rem/1.2 var(--font-display)}
.card h3 small{font:400 .82rem var(--font-ui);color:var(--dim);margin-left:6px}

.hdr{display:grid;gap:8px}
.hdr .grp{display:grid;gap:5px}
.hdr .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.cell{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;min-width:0}
.cell .lab{font-size:.62rem}
.cell .v{font:600 .74rem/1.3 var(--font-mono);overflow-wrap:anywhere}
.cell.flash{animation:flash 1.1s}
.cell.dim .v{color:var(--dim)}
@keyframes flash{0%{background:var(--accent);color:var(--accent-ink)}100%{background:var(--panel2)}}
.cell.flash .v{animation:flashtxt 1.1s}
@keyframes flashtxt{0%{color:var(--accent-ink)}}

.q-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px;font-size:.78rem;color:var(--dim)}
.prompt{margin:0 0 8px;font:600 1.02rem/1.35 var(--font-display)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:6px 10px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--panel2);transition:border-color .15s,background-color .15s,scale .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){scale:.97}
.opt kbd{flex:none;font:600 .78rem var(--font-mono);color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-top:2px}
.opt .ot{display:block;font-weight:600;overflow-wrap:anywhere}
.opt .os{display:block;font:.8rem var(--font-mono);color:var(--dim);overflow-wrap:anywhere}
.opt.right{border-color:var(--good);background:rgba(127,207,134,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(236,111,100,.1);opacity:.75}
.opt:disabled{cursor:default}
.fb{margin-top:8px;padding:7px 10px;border-radius:6px;border-left:3px solid var(--line);background:var(--panel2);font-size:.88rem;line-height:1.4}
.fb.good{border-color:var(--good)}
.fb.bad{border-color:var(--bad)}
.fb .pen{font:600 .85rem var(--font-mono);color:var(--bad)}
.actions{margin-top:8px;display:flex;gap:10px;align-items:center}

.ledger dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 6px}
.ledger dt{color:var(--dim);font-size:.85rem}
.ledger dd{margin:0;font:.82rem var(--font-mono);overflow-wrap:anywhere}
.ledger h4{margin:8px 0 4px;font:600 .72rem var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ledger table{width:100%;border-collapse:collapse;font:.76rem var(--font-mono)}
.ledger th{text-align:left;font:600 .72rem var(--font-ui);color:var(--dim);padding:2px 8px 4px 0}
.ledger td{padding:2px 6px 2px 0;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.ledger tr.fresh td{color:var(--accent)}
.ledger .hint{margin:6px 0 0;font-size:.78rem;color:var(--dim)}
.ledger .none{color:var(--dim);font-size:.85rem}

/* ---------- game over ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,12,15,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.overlay .card{max-width:420px;width:100%;padding:22px}
.overlay h2{margin:0 0 6px;font:600 1.6rem/1.2 var(--font-display)}
.overlay p{margin:0 0 14px;color:var(--dim)}
.overlay .big{font:600 2.4rem/1 var(--font-mono);color:var(--text);margin-bottom:4px}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:900px){
  .chars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scenes{grid-template-columns:repeat(4,minmax(0,1fr))}
  .layout{grid-template-columns:minmax(0,1fr)}
  #q{min-height:0}
  .solo .stage{max-width:none}
}
@media (max-width:640px){
  .scenes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  body{padding:14px 12px 22px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .lbl{font-size:27px}
  .pk-tag text{font-size:18px}
  .vtag{font-size:19px}
  .ifl{font-size:22px}
  .modes{grid-template-columns:minmax(0,1fr)}
  .meter{width:90px}
  .hud{gap:12px}
  .brand h1{font-size:1.4rem}
  /* On a phone the map is small, so the banner sits under it instead of covering the top row. */
  .banner{position:static;max-width:none;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--panel)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="7" width="28" height="20" rx="3" fill="#e8b44c"/><path d="M3 10l14 10L31 10" fill="none" stroke="#1c1405" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <h1>Packet Pilot</h1>
    </div>
    <div class="hud" id="hud" hidden>
      <div class="ttl" id="ttlBox"><span class="lab">TTL</span><div class="meter" id="meter"><i id="meterFill"></i></div><b id="ttlNum">30</b></div>
      <div class="stat"><span class="lab">Delivered</span><b id="delivered">0</b></div>
      <div class="stat"><span class="lab">Best</span><b id="best">0</b></div>
      <button class="btn" id="menuBtn" type="button">Menu</button>
    </div>
  </header>

  <section class="menu" id="menu" aria-label="Set up a run">
    <p class="lead" id="lead"></p>
    <fieldset><legend>Your Packet</legend><div class="choices chars" id="chars" role="radiogroup"></div></fieldset>
    <fieldset><legend>Mode</legend><div class="choices modes" id="modes" role="radiogroup"></div></fieldset>
    <fieldset><legend>Setting</legend><div class="choices scenes" id="scenes" role="radiogroup"></div></fieldset>
    <button class="btn primary go" id="start" type="button">Start</button>
    <p class="best-line" id="bestLine"></p>
  </section>

  <section id="play" class="layout" hidden>
    <div class="col">
      <div class="stage">
        <svg id="scene" viewBox="0 0 1000 560" role="img" aria-label="Map of the network. Select a building to see its tables."></svg>
        <div class="banner" id="banner"></div>
      </div>
      <div class="card" id="q"></div>
    </div>
    <div class="col">
      <div class="card hdr" id="hdr" aria-label="Packet headers"></div>
      <aside class="card ledger" id="ledger" aria-label="Device tables"></aside>
    </div>
  </section>
</div>

<div class="overlay" id="over" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <h2 id="overTitle"></h2>
    <p id="overWhy"></p>
    <div class="big" id="overScore"></div>
    <p id="overBest"></p>
    <div class="row"><button class="btn primary" id="again" type="button">Go again</button><button class="btn" id="toMenu" type="button">Change setup</button></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* PURE START — rules and round generation. No DOM in here, so it can be tested on its own. */

/* ------------------------------------------------------------------------------------
   DRAFT WORDING. Everything the game says lives in this one block so it can be rewritten
   without touching the logic. The facts are right; the tone is a placeholder for Mustafa.
   ------------------------------------------------------------------------------------ */
var T = {
  intro: "You are Packet, crossing a network. At every stop you decide what happens to you. Wrong turns burn TTL, and at zero you're gone.",
  easy: ["Easy", "TTL refills a little after every delivery."],
  hard: ["Hard", "One TTL pool for the whole run. It never refills."],
  deliverTo: function(d, ip){ return "Deliver to <b>" + d + "</b> at " + ip; },

  hostQ: function(h, ip){ return h + " is sending to " + ip + ". Which MAC address goes in the Ethernet destination field?"; },
  hostOkLocal: function(ip, cidr, lo, hi){ return ip + " is inside " + cidr + " (" + lo + " to " + hi + "), so it is on the same subnet. The host ARPs for the destination and sends straight to its MAC."; },
  hostOkRemote: function(ip, cidr, lo, hi, gw){ return ip + " is outside " + cidr + " (" + lo + " to " + hi + "), so it is on another subnet. The host sends to its default gateway, " + gw + ", and the router takes it from there."; },
  hostWhyBroadcast: "Broadcast is for ARP requests. A data frame goes to one specific MAC.",
  hostWhyGateway: function(gw){ return "The destination is on the local subnet. There is no reason to hand it to the gateway (" + gw + ")."; },
  hostWhyRemoteHost: function(d){ return d + "'s MAC only means something on " + d + "'s own subnet. From here the frame has to go to the gateway."; },
  hostWhyOther: function(o){ return "That is " + o + "'s MAC, not the destination's."; },

  swQ: function(sw, port, vl){ return "The frame comes in on " + port + (vl ? " (VLAN " + vl + ")" : "") + ". What does " + sw + " do with it?"; },
  swOkKnown: function(mac, port){ return mac + " is in the MAC table on " + port + ". The switch learned it when the ARP reply came back through here, so it sends the frame out that port only."; },
  swOkFlood: function(mac){ return mac + " is not in the MAC table. The sender still had it cached from earlier, but a switch forgets an address after about five minutes without hearing from it. With no entry, the switch floods the frame out every other port, and learns where the destination is when it answers."; },
  hostArped: function(ip){ return " The host had no entry for " + ip + ", so it broadcast an ARP request asking who owns that IP. The reply is now in its ARP cache, and the switch learned both MACs as the ARP passed through."; },
  hostCached: function(ip){ return " The host already had " + ip + " in its ARP cache from earlier, so it did not need to ask again."; },
  routerArped: function(ip){ return " The router had no entry for " + ip + ", so it sent an ARP request out that interface and cached the reply."; },
  routerCached: function(ip){ return " The router already had " + ip + " in its ARP cache from earlier."; },
  swWhyFlood: function(port){ return "The table already says where the destination is (" + port + "). A known destination is never flooded."; },
  swWhyOther: function(mac, right, port){ return "The table lists " + mac + " on " + right + ", not " + port + "."; },
  swWhyGuess: function(port){ return "The switch has no entry for the destination, so it cannot know that " + port + " is the right one. It floods."; },
  swWhyDrop: "A switch only drops a frame whose destination is on the port it came in on. That is not the case here.",

  rtQ: function(r, ip){ return r + " needs a route for " + ip + ". Which interface does it use?"; },
  rtOkConn: function(cidr, ifn){ return cidr + " is the longest match for the destination, and it is directly connected on " + ifn + "."; },
  rtOkVia: function(cidr, via, ifn){ return cidr + " is the longest match for the destination. Its next hop, " + via + ", is reached out " + ifn + "."; },
  rtWhyShorter: function(m, best){ return m + " matches too, but " + best + " is longer, and the longest match always wins."; },
  rtWhyBack: "That is the interface the frame came in on, and no route sends the destination back that way.",
  rtWhyNone: function(ip, ifn){ return "No route for " + ip + " points out " + ifn + "."; },
  rtWhyDrop: "A route matches, so the router has a place to send it.",

  rwQ: function(r, ifn){ return r + " sends the packet out " + ifn + ". What do the headers look like as it leaves?"; },
  rwOk: function(s, d){ return "The router builds a brand new Ethernet frame: " + s + " as the source and " + d + " as the destination. TTL drops by 1. The IP addresses do not change."; },
  rwWhyOldSrc: function(o){ return o + " was the source on the previous hop. Every hop writes its own MAC as the source."; },
  rwWhyOldDst: function(o){ return o + " was the destination on the previous hop. That frame ended at this router."; },
  rwWhyFinalDst: function(o){ return o + " is not on the next link. The next hop is a router, so the frame is addressed to that router's MAC."; },
  rwWhyTtl: "Every router hop subtracts 1 from TTL.",
  rwWhyIp: "A router leaves the IP addresses alone. Rewriting them is NAT, and nothing here is doing NAT.",

  vlTrunkQ: function(sw, port, v){ return "The frame comes in on " + port + ", an access port in VLAN " + v + ". The way to the router is a trunk. What goes out on it?"; },
  vlTrunkOk: function(v, t){ return "A trunk carries many VLANs, so the switch adds an 802.1Q tag. The tag is the VLAN of the port the frame came in on: VLAN " + v + ". Out " + t + ", tagged."; },
  vlWhyUntagged: "An untagged frame on a trunk counts as native VLAN traffic. The router would not know which VLAN it belongs to.",
  vlWhyWrongTag: function(v){ return "The tag is the VLAN of the port the frame entered on. VLAN " + v + " is not it."; },
  vlWhyNoCross: function(d){ return d + " is in a different VLAN. A switch never moves frames between VLANs by itself. That takes a router."; },
  vlRwOk: function(v){ return "The frame leaves on the VLAN " + v + " subinterface, so it goes back down the trunk tagged VLAN " + v + ". TTL drops by 1."; },
  vlWhyOldTag: function(v){ return "It leaves on the subinterface for the destination's VLAN, so it is tagged with that VLAN, not VLAN " + v + "."; },
  vlWhyUntaggedRw: "The link back to the switch is a trunk. The frame has to carry a tag.",
  vlBackQ: function(sw, port, v){ return "The frame comes back in on trunk " + port + " tagged VLAN " + v + ", headed for a host. What goes out?"; },
  vlBackOk: function(port){ return "The MAC table has the destination on " + port + ", an access port. Access ports carry plain frames, so the tag is removed on the way out."; },
  vlWhyKept: "A host does not understand 802.1Q tags. Access ports always send untagged frames.",
  vlWhyTrunkBack: "The destination is on an access port. Sending the frame back up the trunk goes nowhere useful.",
  vlWhyOtherPort: function(p){ return "The destination is not on " + p + "."; },

  delivered: function(d){ return "Delivered to " + d + "."; },
  deadExpired: function(r){ return "TTL reached 0 at " + r + ". The router drops the packet."; },
  deadWrong: "Too many wrong turns. TTL ran out.",
  refill: function(n){ return "+" + n + " TTL"; }
};

/* ---------- small helpers ---------- */
var rnd = function(n){ return Math.floor(Math.random() * n); };
var pick = function(a){ return a[rnd(a.length)]; };
var shuffle = function(a){ var r = a.slice(); for(var i = r.length - 1; i > 0; i--){ var j = rnd(i + 1); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
var BCAST = "FF:FF:FF:FF:FF:FF";

var ip2n = function(s){ return s.split(".").reduce(function(a, b){ return a * 256 + (+b); }, 0); };
var n2ip = function(n){ return [Math.floor(n / 16777216) % 256, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join("."); };
var maskN = function(p){ return p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0; };
var netOf = function(ip, p){ return (ip2n(ip) & maskN(p)) >>> 0; };
var sameNet = function(a, b, p){ return netOf(a, p) === netOf(b, p); };
var cidrOf = function(net, p){ return n2ip(net) + "/" + p; };

function makeMac(R){
  var m;
  do {
    var b = [];
    for(var i = 0; i < 6; i++) b.push(("0" + rnd(256).toString(16)).slice(-2).toUpperCase());
    b[0] = ("0" + (parseInt(b[0], 16) & 0xFE).toString(16)).slice(-2).toUpperCase();
    m = b.join(":");
  } while(R.macs[m]);
  R.macs[m] = true;
  return m;
}

/* ---------- topology pieces ---------- */
function addNode(R, kind, label, x, y){
  var n = { id: label, kind: kind, label: label, x: x, y: y, ifaces: [], mac: null, ip: null, prefix: null, gw: null, routes: [], vlan: null, table: [], arp: [] };
  if(kind === "host"){ n.mac = makeMac(R); R.owner[n.mac] = label; }
  R.nodes.push(n); R.byId[label] = n;
  return n;
}
function autoName(n){
  if(n.kind === "host") return "NIC";
  if(n.kind === "switch") return "Fa0/" + (n.ifaces.filter(function(f){ return !f.trunk; }).length + 1);
  return "Gi0/" + n.ifaces.length;
}
function addIface(R, n, name){
  var f = { name: name || autoName(n), node: n, mac: null, ip: null, prefix: null, peer: null, vlan: null, trunk: false };
  if(n.kind === "host") f.mac = n.mac;
  if(n.kind === "router"){ f.mac = makeMac(R); R.owner[f.mac] = n.label + " " + f.name; }
  n.ifaces.push(f);
  return f;
}
function connect(R, a, b, an, bn, trunk){
  var ia = addIface(R, a, an), ib = addIface(R, b, bn);
  ia.peer = ib; ib.peer = ia; ia.trunk = ib.trunk = !!trunk;
  R.links.push({ a: a.id, b: b.id, trunk: !!trunk, an: ia.name, bn: ib.name });
  return [ia, ib];
}
/* A switch learns a source MAC on the port a frame arrives on; a device caches IP-to-MAC answers. */
function learn(sw, mac, port, fresh){
  sw.table = sw.table.filter(function(e){ return e.mac !== mac; });
  sw.table.push({ mac: mac, port: port, fresh: !!fresh });
}
function cacheArp(n, ip, mac, fresh){
  n.arp = n.arp.filter(function(e){ return e.ip !== ip; });
  n.arp.push({ ip: ip, mac: mac, fresh: !!fresh });
}
function neighborMac(f){
  var p = f.peer.node;
  return p.kind === "host" ? p.mac : p.kind === "router" ? f.peer.mac : null;
}

/* Subnet planning. Half the time at levels above the first, the LANs are adjacent small blocks
   carved from one /24, so the addresses look like they belong together when they do not. */
function randomParent(used){
  var net;
  do {
    var k = rnd(3);
    net = k === 0 ? ip2n("192.168." + rnd(250) + ".0") : k === 1 ? ip2n("10." + rnd(250) + "." + rnd(250) + ".0") : ip2n("172." + (16 + rnd(16)) + "." + rnd(250) + ".0");
  } while(used[net]);
  used[net] = true;
  return net;
}
function mkLan(net, prefix){
  var size = Math.pow(2, 32 - prefix);
  return { net: net, prefix: prefix, size: size, used: {}, router: null, sw: null, vlan: null,
    gwIp: n2ip(net + 1), cidr: cidrOf(net, prefix),
    alloc: function(){
      var a;
      do { a = net + 2 + rnd(size - 3); } while(this.used[a]);
      this.used[a] = true;
      return n2ip(a);
    } };
}
function planLans(count, sneaky){
  var used = {}, lans = [];
  if(sneaky && count >= 2){
    var p = count === 3 ? pick([26, 27]) : pick([25, 26, 27]);
    var size = Math.pow(2, 32 - p), per = 256 / size;
    var parent = randomParent(used), start = rnd(per - count + 1);
    for(var i = 0; i < count; i++) lans.push(mkLan(parent + (start + i) * size, p));
  } else {
    for(var j = 0; j < count; j++) lans.push(mkLan(randomParent(used), pick([24, 24, 25, 26])));
  }
  return lans;
}
function addHost(R, label, x, y, lan, sw){
  var h = addNode(R, "host", label, x, y);
  h.ip = lan.alloc(); h.prefix = lan.prefix;
  h.gw = lan.router ? lan.gwIp : null;
  h.vlan = lan.vlan;
  var f = connect(R, sw, h)[0];
  f.vlan = lan.vlan;
  return h;
}
function lanRouterIface(R, router, sw, lan){
  var f = connect(R, router, sw)[0];
  f.ip = lan.gwIp; f.prefix = lan.prefix;
  lan.router = router; lan.sw = sw;
  return f;
}
function twoOf(a){ var s = shuffle(a); return [s[0], s[1]]; }

/* ---------- routing ---------- */
function hits(rt, ip){ return ((ip2n(ip) & maskN(rt.prefix)) >>> 0) === rt.net; }
function lookup(r, ip){
  var best = null;
  r.routes.forEach(function(rt){ if(hits(rt, ip) && (!best || rt.prefix > best.prefix)) best = rt; });
  return best;
}
function mkRoute(code, net, prefix, iface, via){
  return { code: code, net: net, prefix: prefix, iface: iface, via: via || null, cidr: cidrOf(net, prefix) };
}
function nextRouterToward(R, from, target){
  /* BFS over routers only; returns the neighbouring router to go through. */
  var seen = {}, queue = [[from, null]];
  seen[from.id] = true;
  while(queue.length){
    var cur = queue.shift(), n = cur[0], first = cur[1];
    if(n === target) return first;
    n.ifaces.forEach(function(f){
      var p = f.peer.node;
      if(p.kind === "router" && !seen[p.id]){ seen[p.id] = true; queue.push([p, first || { router: p, iface: f }]); }
    });
  }
  return null;
}
function buildRoutes(R){
  var routers = R.nodes.filter(function(n){ return n.kind === "router"; });
  routers.forEach(function(r){
    r.routes = [];
    (r.subs || r.ifaces).forEach(function(f){ if(f.ip) r.routes.push(mkRoute("C", netOf(f.ip, f.prefix), f.prefix, f)); });
  });
  routers.forEach(function(r){
    var statics = [];
    R.lans.forEach(function(lan){
      if(!lan.router || lan.router === r) return;
      var hop = nextRouterToward(R, r, lan.router);
      if(hop) statics.push(mkRoute("S", lan.net, lan.prefix, hop.iface, hop.iface.peer.ip));
    });
    var hops = {};
    statics.forEach(function(s){ hops[s.via] = true; });
    var leaf = Object.keys(hops).length === 1;
    if(leaf && statics.length && Math.random() < 0.5){
      var s0 = statics[0];
      r.routes.push(mkRoute("S*", 0, 0, s0.iface, s0.via));
    } else {
      statics.forEach(function(s){ r.routes.push(s); });
    }
  });
}

/* ---------- graph path ---------- */
function pathBetween(R, a, b){
  var seen = {}, queue = [[a]];
  seen[a.id] = true;
  while(queue.length){
    var p = queue.shift(), n = p[p.length - 1];
    if(n === b) return p;
    n.ifaces.forEach(function(f){
      var q = f.peer.node;
      if(!seen[q.id]){ seen[q.id] = true; queue.push(p.concat([q])); }
    });
  }
  return null;
}

/* ---------- questions ---------- */
function ownerOf(R, mac){ return R.owner[mac] || mac; }
function lanText(ip, prefix){
  var net = netOf(ip, prefix), size = Math.pow(2, 32 - prefix);
  return { cidr: cidrOf(net, prefix), lo: n2ip(net), hi: n2ip(net + size - 1) };
}
function finishOptions(opts){
  /* One right answer, every wrong one explained, no two options reading the same. */
  var seen = {};
  opts.forEach(function(o){ var k = o.text + "|" + (o.sub || ""); if(seen[k]) throw new Error("duplicate option " + k); seen[k] = true; });
  return shuffle(opts);
}

function hostStep(R, src, dst, gwIf, cached, hop){
  var local = sameNet(src.ip, dst.ip, src.prefix);
  var tIp = local ? dst.ip : src.gw, tMac = local ? dst.mac : gwIf.mac;
  if(cached) cacheArp(src, tIp, tMac, false);
  var sw = src.ifaces[0].peer.node;
  var mates = sw.ifaces.map(function(f){ return f.peer.node; }).filter(function(n){ return n.kind === "host" && n !== src && n !== dst; });
  var info = lanText(src.ip, src.prefix);
  var gwName = gwIf ? gwIf.node.label + " " + gwIf.name : null;
  return { kind: "host", at: src.id, ask: function(st){
    var ok, opts = [];
    if(local){
      ok = { text: dst.label, sub: dst.mac, ok: true, mac: dst.mac };
      if(gwIf) opts.push({ text: gwName, sub: gwIf.mac, ok: false, why: T.hostWhyGateway(gwIf.ip) });
      if(mates.length) opts.push({ text: mates[0].label, sub: mates[0].mac, ok: false, why: T.hostWhyOther(mates[0].label) });
    } else {
      ok = { text: gwName, sub: gwIf.mac, ok: true, mac: gwIf.mac };
      opts.push({ text: dst.label, sub: dst.mac, ok: false, why: T.hostWhyRemoteHost(dst.label) });
      if(mates.length) opts.push({ text: mates[0].label, sub: mates[0].mac, ok: false, why: T.hostWhyOther(mates[0].label) });
    }
    opts.push({ text: "Broadcast", sub: BCAST, ok: false, why: T.hostWhyBroadcast });
    opts.push(ok);
    return {
      prompt: T.hostQ(src.label, dst.ip),
      options: finishOptions(opts),
      good: (local ? T.hostOkLocal(dst.ip, info.cidr, info.lo, info.hi) : T.hostOkRemote(dst.ip, info.cidr, info.lo, info.hi, src.gw)) + (cached ? T.hostCached(tIp) : T.hostArped(tIp)),
      apply: function(s){
        s.hdr.dstMac = ok.mac;
        if(!cached){
          cacheArp(src, tIp, tMac, true);
          // the request was a broadcast from src and the reply came back from the target, so the switch heard both
          if(hop){ hop.sw.table.forEach(function(e){ e.fresh = false; }); learn(hop.sw, src.mac, hop.inIf.name, true); learn(hop.sw, tMac, hop.outIf.name, true); }
        }
        return ["dstMac"];
      }
    };
  } };
}

function switchStep(R, sw, inIf, outIf, cached){
  /* The destination is in the table when the sender just ARPed (the reply taught the switch).
     It is missing when the sender's ARP entry was cached and the switch's own entry aged out. */
  var known = !cached;
  var others = sw.ifaces.filter(function(f){ return f !== inIf; });
  sw.table = [];
  others.forEach(function(f){
    if(f !== outIf && Math.random() < 0.6){ var m = neighborMac(f); if(m) learn(sw, m, f.name, false); }
  });
  var vl = inIf.vlan ? "VLAN " + inIf.vlan + " " : "";
  return { kind: "switch", at: sw.id, ask: function(st){
    var dstMac = st.hdr.dstMac, srcMac = st.hdr.srcMac;
    sw.table.forEach(function(e){ e.fresh = false; });
    learn(sw, srcMac, inIf.name, true);           // every frame teaches the switch where its sender is
    if(known) learn(sw, dstMac, outIf.name, false);
    else sw.table = sw.table.filter(function(e){ return e.mac !== dstMac; });
    var flood = "Flood: every " + vl + "port except " + inIf.name;
    var drop = { text: "Drop the frame", ok: false, why: T.swWhyDrop };
    var opts;
    if(known){
      var wrong = [{ text: flood, ok: false, why: T.swWhyFlood(outIf.name) }, drop];
      shuffle(others.filter(function(f){ return f !== outIf; })).slice(0, 2).forEach(function(f){
        wrong.push({ text: "Out " + f.name + " only", ok: false, why: T.swWhyOther(dstMac, outIf.name, f.name) });
      });
      opts = [{ text: "Out " + outIf.name + " only", ok: true }].concat(shuffle(wrong).slice(0, 3));
    } else {
      var wrong2 = [drop];
      shuffle(others).slice(0, 2).forEach(function(f){
        wrong2.push({ text: "Out " + f.name + " only", ok: false, why: T.swWhyGuess(f.name) });
      });
      opts = [{ text: flood, ok: true }].concat(shuffle(wrong2).slice(0, 3));
    }
    return {
      prompt: T.swQ(sw.label, inIf.name, inIf.vlan),
      options: finishOptions(opts),
      good: known ? T.swOkKnown(dstMac, outIf.name) : T.swOkFlood(dstMac),
      apply: function(){ return []; }
    };
  } };
}

function routerEgressStep(R, r, inIf, outIf){
  return { kind: "route", at: r.id, expect: outIf.name, ask: function(st){
    var dstIp = st.hdr.dstIp, best = lookup(r, dstIp);
    var ifs = r.subs || r.ifaces;
    var matches = r.routes.filter(function(rt){ return hits(rt, dstIp); });
    var opts = ifs.map(function(f){
      var o = { text: f.name, sub: f.ip + "/" + f.prefix, ok: f === best.iface };
      if(!o.ok){
        var m = matches.filter(function(rt){ return rt.iface === f; })[0];
        o.why = m ? T.rtWhyShorter(m.cidr, best.cidr) : f === inIf ? T.rtWhyBack : T.rtWhyNone(dstIp, f.name);
      }
      return o;
    });
    opts.push({ text: "Drop it", sub: "no route", ok: false, why: T.rtWhyDrop });
    return {
      prompt: T.rtQ(r.label, dstIp),
      options: finishOptions(opts),
      good: best.via ? T.rtOkVia(best.cidr, best.via, best.iface.name) : T.rtOkConn(best.cidr, best.iface.name),
      apply: function(){ return []; }
    };
  } };
}

function routerRewriteStep(R, r, inIf, outIf, dst, cached){
  var nIf = outIf.peer, nNode = nIf.node;
  var hopIp = nNode.kind === "router" ? nIf.ip : dst.ip, hopMac = nNode.kind === "router" ? nIf.mac : dst.mac;
  if(cached) cacheArp(r, hopIp, hopMac, false);
  return { kind: "rewrite", at: r.id, ask: function(st){
    var nextNode = outIf.peer.node;
    var nextMac = nextNode.kind === "router" ? outIf.peer.mac : dst.mac;
    var own = function(m){ return ownerOf(R, m); };
    var mk = function(src, d, dec, ip, ok, why){
      return { text: "Eth " + own(src) + " → " + own(d), sub: (dec ? "TTL minus 1" : "TTL unchanged") + " · " + ip, ok: ok, why: why };
    };
    var same = "IP addresses unchanged";
    var okOpt = mk(outIf.mac, nextMac, true, same, true);
    var variants = [
      mk(st.hdr.srcMac, nextMac, true, same, false, T.rwWhyOldSrc(own(st.hdr.srcMac))),
      mk(outIf.mac, st.hdr.dstMac, true, same, false, T.rwWhyOldDst(own(st.hdr.dstMac))),
      mk(outIf.mac, nextMac, false, same, false, T.rwWhyTtl),
      mk(outIf.mac, nextMac, true, "source IP becomes " + outIf.ip, false, T.rwWhyIp)
    ];
    var chosen;
    if(nextNode.kind === "router"){
      var fin = mk(outIf.mac, dst.mac, true, same, false, T.rwWhyFinalDst(own(dst.mac)));
      chosen = [fin].concat(shuffle(variants).slice(0, 2));
    } else chosen = shuffle(variants).slice(0, 3);
    return {
      prompt: T.rwQ(r.label, outIf.name),
      options: finishOptions([okOpt].concat(chosen)),
      good: T.rwOk(own(outIf.mac), own(nextMac)) + (cached ? T.routerCached(hopIp) : T.routerArped(hopIp)),
      apply: function(s){
        s.hdr.srcMac = outIf.mac; s.hdr.dstMac = nextMac; s.hdr.ttl -= 1;
        if(!cached){
          cacheArp(r, hopIp, hopMac, true);
          // a switch on that link heard the router's ARP request and the destination's reply
          if(nNode.kind === "switch"){
            var dp = nNode.ifaces.filter(function(f){ return f.peer.node === dst; })[0];
            nNode.table.forEach(function(e){ e.fresh = false; });
            learn(nNode, outIf.mac, nIf.name, true);
            if(dp) learn(nNode, dst.mac, dp.name, true);
          }
        }
        return ["srcMac", "dstMac", "ttl"];
      }
    };
  } };
}

/* Router-on-a-stick: one switch, one router, a trunk between them. */
function vlanAccessStep(R, sw, src, dst, trunkIf, r1phy){
  var inIf = src.ifaces[0].peer, dstPort = dst.ifaces[0].peer;
  return { kind: "switch", at: sw.id, ask: function(st){
    var a = src.vlan, b = dst.vlan;
    sw.table.forEach(function(e){ e.fresh = false; });
    learn(sw, st.hdr.srcMac, inIf.name, true);
    var opts = [
      { text: "Out " + trunkIf.name + " (trunk), tagged VLAN " + a, ok: true },
      { text: "Out " + trunkIf.name + " (trunk), untagged", ok: false, why: T.vlWhyUntagged },
      { text: "Out " + trunkIf.name + " (trunk), tagged VLAN " + b, ok: false, why: T.vlWhyWrongTag(b) },
      { text: "Out " + dstPort.name + " only", ok: false, why: T.vlWhyNoCross(dst.label) }
    ];
    return {
      prompt: T.vlTrunkQ(sw.label, inIf.name, a),
      options: finishOptions(opts),
      good: T.vlTrunkOk(a, trunkIf.name),
      apply: function(s){ s.hdr.vlan = a; return ["vlan"]; }
    };
  } };
}
function vlanRewriteStep(R, r, inIf, outIf, dst, r1phy){
  return { kind: "rewrite", at: r.id, ask: function(st){
    var own = function(m){ return ownerOf(R, m); }, a = st.hdr.vlan, b = outIf.vlan;
    var line = function(dec, tag, ok, why){ return { text: "Eth " + own(r1phy.mac) + " → " + own(dst.mac), sub: tag + " · " + (dec ? "TTL minus 1" : "TTL unchanged"), ok: ok, why: why }; };
    var opts = [
      line(true, "802.1Q VLAN " + b, true),
      line(true, "802.1Q VLAN " + a, false, T.vlWhyOldTag(a)),
      line(false, "802.1Q VLAN " + b, false, T.rwWhyTtl),
      line(true, "no 802.1Q tag", false, T.vlWhyUntaggedRw)
    ];
    return {
      prompt: T.rwQ(r.label, outIf.name),
      options: finishOptions(opts),
      good: T.vlRwOk(b),
      apply: function(s){
        s.hdr.srcMac = r1phy.mac; s.hdr.dstMac = dst.mac; s.hdr.ttl -= 1; s.hdr.vlan = b;
        cacheArp(r, dst.ip, dst.mac, true);
        // the router's ARP request went out the trunk tagged for the destination's VLAN, and the reply came back
        var sw = r1phy.peer.node;
        sw.table.forEach(function(e){ e.fresh = false; });
        learn(sw, dst.mac, dst.ifaces[0].peer.name, true);
        return ["srcMac", "dstMac", "ttl", "vlan"];
      }
    };
  } };
}
function vlanBackStep(R, sw, dst, trunkIf, r1phy, other){
  sw.table = sw.table || [];
  var dstPort = dst.ifaces[0].peer, otherPort = other ? other.ifaces[0].peer : null;
  return { kind: "switch", at: sw.id, ask: function(st){
    sw.table.forEach(function(e){ e.fresh = false; });
    learn(sw, st.hdr.srcMac, trunkIf.name, true);
    var opts = [
      { text: "Out " + dstPort.name + " only, tag removed", ok: true },
      { text: "Out " + dstPort.name + " only, tag kept", ok: false, why: T.vlWhyKept },
      { text: "Out " + trunkIf.name + " (trunk) only", ok: false, why: T.vlWhyTrunkBack }
    ];
    if(otherPort) opts.push({ text: "Out " + otherPort.name + " only, tag removed", ok: false, why: T.vlWhyOtherPort(otherPort.name) });
    return {
      prompt: T.vlBackQ(sw.label, trunkIf.name, st.hdr.vlan),
      options: finishOptions(opts),
      good: T.vlBackOk(dstPort.name),
      apply: function(s){ s.hdr.vlan = null; return ["vlan"]; }
    };
  } };
}

/* ---------- round builders ---------- */
function planGeneric(R, src, dst){
  var path = pathBetween(R, src, dst), steps = [];
  var gwIf = null;
  if(src.gw){
    R.nodes.forEach(function(n){ if(n.kind === "router") (n.subs || n.ifaces).forEach(function(f){ if(f.ip === src.gw) gwIf = f; }); });
  }
  /* Roughly a quarter of the time the sender already has the answer in its ARP cache. Then the
     switch beyond it, which forgets after five minutes, is the one that has to flood. */
  var senderCached = Math.random() < 0.28;
  var first = path[1], firstIn = first.ifaces.filter(function(f){ return f.peer.node === path[0]; })[0];
  var firstOut = first.ifaces.filter(function(f){ return f.peer.node === path[2]; })[0];
  steps.push(hostStep(R, src, dst, gwIf, senderCached, first.kind === "switch" ? { sw: first, inIf: firstIn, outIf: firstOut } : null));
  if(first.kind === "switch") first.table = [];
  for(var i = 1; i < path.length - 1; i++){
    var n = path[i], prev = path[i - 1], next = path[i + 1];
    var inIf = n.ifaces.filter(function(f){ return f.peer.node === prev; })[0];
    var outIf = n.ifaces.filter(function(f){ return f.peer.node === next; })[0];
    if(n.kind === "switch") steps.push(switchStep(R, n, inIf, outIf, senderCached));
    else {
      var rc = Math.random() < 0.28;
      steps.push(routerEgressStep(R, n, inIf, outIf)); steps.push(routerRewriteStep(R, n, inIf, outIf, dst, rc));
      senderCached = rc;
    }
  }
  steps.push({ kind: "arrive", at: dst.id });
  R.src = src; R.dst = dst; R.steps = steps;
}

function genT0(R){
  var lan = planLans(1, false)[0];
  var sw = addNode(R, "switch", "SW1", 500, 262);
  lan.sw = sw; R.lans = [lan];
  var pos = [[130, 150], [130, 400], [870, 150], [870, 400]];
  var hosts = pos.map(function(p, i){ return addHost(R, "PC-" + "ABCD".charAt(i), p[0], p[1], lan, sw); });
  var sd = twoOf(hosts);
  planGeneric(R, sd[0], sd[1]);
}
function genT1(R){
  var lans = planLans(2, Math.random() < 0.5), la = lans[0], lb = lans[1];
  var sw1 = addNode(R, "switch", "SW1", 280, 275), r1 = addNode(R, "router", "R1", 500, 275), sw2 = addNode(R, "switch", "SW2", 720, 275);
  lanRouterIface(R, r1, sw1, la); lanRouterIface(R, r1, sw2, lb);
  R.lans = lans;
  var A = [addHost(R, "PC-A", 110, 150, la, sw1), addHost(R, "PC-B", 110, 410, la, sw1)];
  var B = [addHost(R, "PC-C", 890, 150, lb, sw2), addHost(R, "PC-D", 890, 410, lb, sw2)];
  buildRoutes(R);
  var left = Math.random() < 0.5, sameSide = Math.random() < 0.2;

function sceneMarkup(R, sc, id){
  var rng = mulberry(Math.floor(Math.random() * 1e9)), out = '';
  out += '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + sc.sky[0] + '"/><stop offset="1" stop-color="' + sc.sky[1] + '"/></linearGradient>' +

  var links = R.links.map(function(l){ return [base(R.byId[l.a]), base(R.byId[l.b])]; });
  var pts = [], placed = [];

      var x = 30 + rng() * 940, y = GROUND + 24 + rng() * (560 - GROUND - 30);

        links.every(function(l){ return segDist(x, y, l[0].x, l[0].y, l[1].x, l[1].y) > 30; }) &&
        placed.every(function(p){ return Math.hypot(p.x - x, p.y - y) > 26; });

  out += pts.map(function(p){ return D[p.f](Math.round(p.x), Math.round(p.y), p.s.toFixed(2), sc); }).join("");
  /* roads */
  R.links.forEach(function(l){
    var a = base(R.byId[l.a]), b = base(R.byId[l.b]), w = l.trunk ? 26 : 20;
    out += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="#000" stroke-opacity=".2" stroke-width="' + (w + 5) + '" stroke-linecap="round"/>' +
      '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + sc.road + '" stroke-width="' + w + '" stroke-linecap="round"/>' +
      '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + sc.line + '" stroke-width="' + (l.trunk ? 3 : 2.4) + '" stroke-dasharray="' + (l.trunk ? "2 7" : "7 9") + '" stroke-linecap="round" opacity=".75"/>';
  });
  out += '<g id="trail"></g>';
  /* buildings, back to front */
  var vlans = {};
  R.lans.forEach(function(l, i){ if(l.vlan) vlans[l.vlan] = VCOL[i % VCOL.length]; });
  R.nodes.slice().sort(function(a, b){ return a.y - b.y; }).forEach(function(n){
    var role = sc.names[n.kind], kindName = n.kind === "host" ? "PC" : n.kind === "switch" ? "Switch" : "Router";
    out += '<g class="node" data-id="' + n.id + '" tabindex="0" role="button" aria-label="' + n.label + ', ' + kindName + '. Show its tables." transform="translate(' + n.x + ' ' + n.y + ')">' +
      '<ellipse class="ring" cx="0" cy="40" rx="52" ry="15"/><ellipse cx="0" cy="40" rx="36" ry="7" fill="#000" opacity=".2"/>' +
      '<g class="glyph" transform="translate(-42 -36) scale(.84)">' + GLYPH[id][n.kind] + '</g>' +
      '<text class="lbl" y="64" text-anchor="middle">' + n.label + '</text><title>' + n.label + ' (' + kindName + ', the ' + role + ')</title>';
    if(n.kind === "host" && n.vlan) out += '<g transform="translate(14 -32)"><rect width="34" height="19" rx="4" fill="' + vlans[n.vlan] + '"/><text class="vtag" x="17" y="14" text-anchor="middle">' + n.vlan + '</text></g>';
    out += '</g>';
  });
  /* interface names, one near each end of every road */
  R.links.forEach(function(l){
    var a = base(R.byId[l.a]), b = base(R.byId[l.b]), len = Math.hypot(b.x - a.x, b.y - a.y) || 1, ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
    var off = Math.min(78, len * 0.36);
    [[a, l.an, 1], [b, l.bn, -1]].forEach(function(e){
      var x = e[0].x + ux * off * e[2], y = e[0].y + uy * off * e[2];
      out += '<text class="ifl" x="' + x.toFixed(1) + '" y="' + (y + 5.5).toFixed(1) + '" text-anchor="middle">' + e[1] + '</text>';
    });
  });
  var d = R.dst;
  out += '<g transform="translate(' + (d.x - 34) + ' ' + (d.y - 36) + ')" pointer-events="none"><path d="M0 0V38" stroke="#f4efe3" stroke-width="2.6"/><path class="flag" style="fill:var(--accent)" d="M1.5 1H25L18 9L25 17H1.5Z"/></g>';
  out += '<g id="pkLayer"></g><g id="fx"></g><rect width="1000" height="560" fill="url(#vig)" pointer-events="none"/>';
  return out;
}
function packetMarkup(ch){
  return '<g class="pk" id="pk"><g class="who" id="pkWho"><ellipse cx="0" cy="1" rx="20" ry="5" fill="#000" opacity=".25"/>' +
    '<g id="pkFlip"><g transform="translate(-32 -61) scale(.8)">' + ch.svg + '</g></g></g>' +
    '<g class="pk-tag" transform="translate(0 -74)"><rect x="-34" y="-14" width="68" height="23" rx="5"/><text id="pkTtl" text-anchor="middle" y="3"></text></g></g>';
}
function renderScene(fresh){
  var sc = SCENES[S.scene], R = S.round;
  document.documentElement.style.setProperty("--accent", sc.accent);
  svg.setAttribute("style", varStyle(sc));
  svg.innerHTML = sceneMarkup(R, sc, S.scene);
  var ch = CHARS.filter(function(c){ return c.id === S.char; })[0];
  $("pkLayer").innerHTML = packetMarkup(ch);
  pkEl = $("pk");
  if(fresh){ svg.classList.remove("enter"); void svg.getBoundingClientRect(); svg.classList.add("enter"); }

  setPk(a.x, a.y);
  setTtlTag();
}
function setPk(x, y){ pos.x = x; pos.y = y; pkEl.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")"); }
function setFlip(dir){ $("pkFlip").setAttribute("transform", dir < 0 ? "scale(-1 1)" : ""); }
function setTtlTag(){ var t = $("pkTtl"); if(t) t.textContent = "TTL " + S.ttl; }
function moveTo(x, y){
  return new Promise(function(res){
    var token = ++moveToken, fx = pos.x, fy = pos.y, dx = x - fx, dy = y - fy, dist = Math.hypot(dx, dy);
    if(!dist || REDUCED){ setPk(x, y); res(); return; }

}
function anim(cls){
  var w = $("pkWho"); if(!w) return;
  w.classList.remove("shake", "hop"); void w.getBoundingClientRect(); w.classList.add(cls);
}
function floatText(text, cls){
  var fx = $("fx"); if(!fx) return;
  var t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("class", "float " + cls); t.setAttribute("x", pos.x + 6); t.setAttribute("y", pos.y - 84); t.setAttribute("text-anchor", "middle");
  t.textContent = text; fx.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 1400);
}
function drawTrail(a, b){
  var t = $("trail"); if(!t) return;
  var p = base(a), q = base(b);
  t.insertAdjacentHTML("beforeend", '<line x1="' + p.x + '" y1="' + p.y + '" x2="' + q.x + '" y2="' + q.y + '" stroke-width="7" stroke-linecap="round" opacity=".55" style="stroke:var(--accent)"/>');
}
function setCurrent(id){
  Array.prototype.forEach.call(svg.querySelectorAll(".node"), function(n){ n.classList.toggle("current", n.getAttribute("data-id") === id); });
}
function markInspected(){
  Array.prototype.forEach.call(svg.querySelectorAll(".node"), function(n){ n.classList.toggle("inspected", n.getAttribute("data-id") === S.inspect); });
}

/* ---------- hud ---------- */
function updateHud(hit){
  var m = MODES[S.mode], f = Math.max(0, S.ttl) / m.max;
  $("meterFill").style.width = Math.round(f * 100) + "%";
  $("meter").className = "meter" + (f <= 0.25 ? " low" : f <= 0.5 ? " mid" : "");
  $("ttlNum").textContent = Math.max(0, S.ttl);
  $("delivered").textContent = S.delivered;
  $("best").textContent = Math.max(S.delivered, +store.get("best-" + S.mode, 0));
  if(hit){ var b = $("ttlBox"); b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit"); }
  setTtlTag();
}
function setTtl(v, hit){ S.ttl = v; if(S.st) S.st.hdr.ttl = v; updateHud(hit); }

/* ---------- panels ---------- */
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function renderHdr(changed){
  var h = S.st.hdr, R = S.round;
  var cell = function(k, label, val, dim){
    return '<div class="cell' + (changed && changed.indexOf(k) > -1 ? " flash" : "") + (dim ? " dim" : "") + '"><span class="lab">' + label + '</span><div class="v">' + esc(val) + '</div></div>';
  };
  $("hdr").innerHTML = '<div class="grp"><span class="lab">Ethernet frame</span><div class="row">' +
    cell("srcMac", "Source MAC", h.srcMac) + cell("dstMac", "Destination MAC", h.dstMac || "not set yet", !h.dstMac) +
    (R.tier === 3 ? cell("vlan", "802.1Q tag", h.vlan ? "VLAN " + h.vlan : "none", !h.vlan) : "") +
    '</div></div><div class="grp"><span class="lab">IP packet</span><div class="row">' +
    cell("srcIp", "Source IP", h.srcIp) + cell("dstIp", "Destination IP", h.dstIp) + cell("ttl", "TTL", h.ttl) + '</div></div>';
}
function arpHtml(n){
  return '<h4>ARP cache</h4>' + (n.arp.length ? '<table><tr><th>IP address</th><th>MAC</th></tr>' +
    n.arp.map(function(e){ return '<tr' + (e.fresh ? ' class="fresh"' : '') + '><td>' + e.ip + '</td><td>' + e.mac + '</td></tr>'; }).join("") + '</table>' : '<p class="none">Empty. Nothing has had to ask who owns an IP yet.</p>');
}
function ledgerHtml(n){
  var sc = SCENES[S.scene], kindName = n.kind === "host" ? "PC" : n.kind === "switch" ? "Switch" : "Router";
  var out = '<h3>' + n.label + '<small>' + kindName + ' (the ' + sc.names[n.kind] + ')</small></h3>';
  if(n.kind === "host"){
    out += '<dl><dt>IP address</dt><dd>' + n.ip + '/' + n.prefix + '</dd><dt>Subnet mask</dt><dd>' + n2ip(maskN(n.prefix)) + '</dd>' +
      '<dt>Default gateway</dt><dd>' + (n.gw || "none") + '</dd><dt>MAC address</dt><dd>' + n.mac + '</dd>' + (n.vlan ? '<dt>VLAN</dt><dd>' + n.vlan + '</dd>' : '') + '</dl>' + arpHtml(n);
  } else if(n.kind === "switch"){
    out += '<h4>Ports</h4><table><tr><th>Port</th><th>Mode</th><th>Connected to</th></tr>' +
      n.ifaces.map(function(f){ return '<tr><td>' + f.name + '</td><td>' + (f.trunk ? "trunk" : f.vlan ? "access, VLAN " + f.vlan : "access") + '</td><td>' + f.peer.node.label + '</td></tr>'; }).join("") + '</table>' +
      '<h4>MAC address table</h4>' + (n.table.length ? '<table><tr><th>MAC</th><th>Port</th></tr>' +
      n.table.map(function(e){ return '<tr' + (e.fresh ? ' class="fresh"' : '') + '><td>' + e.mac + '</td><td>' + e.port + '</td></tr>'; }).join("") + '</table>' : '<p class="none">Empty. The switch has not heard from anyone yet.</p>');
  } else {
    var ifs = n.subs || n.ifaces;
    out += '<h4>Interfaces</h4><table><tr><th>Name</th><th>Address</th><th>MAC</th></tr>' +
      ifs.map(function(f){ return '<tr><td>' + f.name + '</td><td>' + f.ip + '/' + f.prefix + '</td><td>' + f.mac + '</td></tr>'; }).join("") + '</table>' +
      '<h4>Routing table</h4><table><tr><th></th><th>Network</th><th>Next hop / out</th></tr>' +
      n.routes.map(function(r){ return '<tr><td>' + r.code + '</td><td>' + r.cidr + '</td><td>' + (r.via ? "via " + r.via : r.iface.name) + '</td></tr>'; }).join("") + '</table>' + arpHtml(n);

}
function renderLedger(){
  var n = S.round.byId[S.inspect];
  $("ledger").innerHTML = n ? ledgerHtml(n) : "";
  markInspected();
}

/* ---------- flow ---------- */
function questionCount(){ return S.round.steps.filter(function(s){ return s.kind !== "arrive"; }).length; }
function showStep(){
  var step = S.round.steps[S.stepIdx];
  setCurrent(step.at);
  S.inspect = step.at;
  if(step.kind === "arrive"){ renderLedger(); return arrive(); }
  var q = step.ask(S.st);
  S.q = q; S.answered = false;
  renderLedger();
  $("q").innerHTML = '<div class="q-top"><span>Step ' + (S.stepIdx + 1) + ' of ' + questionCount() + '</span><span>At ' + step.at + '</span></div>' +
    '<h2 class="prompt">' + esc(q.prompt) + '</h2><div class="opts" role="group" aria-label="Choices">' +
    q.options.map(function(o, i){
      return '<button class="opt" type="button" data-i="' + i + '"><kbd>' + (i + 1) + '</kbd><span><span class="ot">' + esc(o.text) + '</span>' + (o.sub ? '<span class="os">' + esc(o.sub) + '</span>' : '') + '</span></button>';
    }).join("") + '</div><div class="fb" id="fb" role="status" aria-live="polite" hidden></div><div class="actions"><button class="btn primary" id="cont" type="button" hidden>Keep going</button></div>';
  var first = $("q").querySelector(".opt");
  if(first && !S.round.fresh) first.focus({ preventScroll: true });
  S.round.fresh = false;
}
function showFb(kind, html){
  var f = $("fb"); f.className = "fb " + kind; f.innerHTML = html; f.hidden = false;
}
function answer(i){
  if(S.answered || S.dead) return;
  var o = S.q.options[i], btn = $("q").querySelectorAll(".opt")[i];
  if(o.ok){
    S.answered = true;
    Array.prototype.forEach.call($("q").querySelectorAll(".opt"), function(b){ b.disabled = true; });
    btn.classList.add("right");
    var changed = S.q.apply(S.st);
    renderLedger();   // the answer may have taught a device something (an ARP reply, a learned MAC)
    if(changed.indexOf("ttl") > -1){ setTtl(S.st.hdr.ttl, true); floatText("-1", "neg"); }
    renderHdr(changed);
    anim("hop");
    if(S.ttl <= 0){ showFb("bad", esc(S.q.good)); setTimeout(function(){ gameOver(T.deadExpired(S.round.steps[S.stepIdx].at)); }, 900); return; }
    showFb("good", esc(S.q.good));
    var c = $("cont"); c.hidden = false; c.focus({ preventScroll: true });
  } else {
    btn.disabled = true; btn.classList.add("wrong");

    setTtl(S.ttl - pen, true); floatText("-" + pen, "neg");
    renderHdr(["ttl"]);
    anim("shake");
    showFb("bad", '<span class="pen">-' + pen + ' TTL</span> ' + esc(o.why));
    if(S.ttl <= 0){ Array.prototype.forEach.call($("q").querySelectorAll(".opt"), function(b){ b.disabled = true; }); setTimeout(function(){ gameOver(T.deadWrong); }, 900); return; }

function next(){
  var c = $("cont"); if(c) c.disabled = true;
  var prev = S.round.steps[S.stepIdx];
  S.stepIdx++;
  var step = S.round.steps[S.stepIdx];
  if(step.at !== prev.at){
    drawTrail(S.round.byId[prev.at], S.round.byId[step.at]);
    var a = anchor(S.round.byId[step.at]);
    setCurrent(null);
    moveTo(a.x, a.y).then(showStep);
  } else showStep();
}
function arrive(){
  var R = S.round, m = MODES[S.mode];
  S.delivered++;
  var gain = 0;
  if(m.refill){ var before = S.ttl; S.ttl = Math.min(m.max, S.ttl + m.refill); gain = S.ttl - before; S.st.hdr.ttl = S.ttl; }
  if(S.delivered > +store.get("best-" + S.mode, 0)) store.set("best-" + S.mode, S.delivered);
  updateHud(false);
  anim("hop");
  if(gain) floatText(T.refill(gain), "pos");
  renderHdr(gain ? ["ttl"] : []);
  $("q").innerHTML = '<div class="q-top"><span>Delivered</span><span>' + S.delivered + ' so far</span></div><h2 class="prompt">' + esc(T.delivered(R.dst.label)) + '</h2>' +
    '<div class="actions"><button class="btn primary" id="nextRound" type="button">Next delivery</button></div>';
  $("nextRound").focus({ preventScroll: true });
}
function chooseScene(){
  if(S.setting !== "journey"){ S.scene = S.setting; S.roundsHere = 0; return false; }
  if(S.roundsHere >= 3 || !S.round){
    var opts = SCENE_IDS.filter(function(id){ return id !== S.scene || !S.round; });
    var was = S.scene; S.scene = pick(opts); S.roundsHere = 0;
    return S.scene !== was;
  }
  return false;
}
function nextRound(){
  S.round = generateRound(pickTier(S.delivered));
  S.round.fresh = true;
  var changed = chooseScene();
  S.roundsHere++;
  S.st = { hdr: { srcMac: S.round.src.mac, dstMac: null, srcIp: S.round.src.ip, dstIp: S.round.dst.ip, ttl: S.ttl, vlan: null } };
  S.stepIdx = 0;
  renderScene(changed || S.delivered === 0 && S.roundsHere === 1);
  setFlip(S.round.src.x > 500 ? -1 : 1);
  $("banner").innerHTML = T.deliverTo(S.round.dst.label, S.round.dst.ip);
  renderHdr([]);
  showStep();
}
function gameOver(reason){
  if(S.dead) return;
  S.dead = true;
  $("overTitle").textContent = "Packet dropped";
  $("overWhy").textContent = reason;
  $("overScore").textContent = S.delivered + (S.delivered === 1 ? " delivery" : " deliveries");
  $("overBest").textContent = "Best on " + (S.mode === "easy" ? "Easy" : "Hard") + ": " + Math.max(S.delivered, +store.get("best-" + S.mode, 0));
  $("over").hidden = false;
  $("again").focus();
}
function startRun(){
  var m = MODES[S.mode];
  S.ttl = m.max; S.delivered = 0; S.dead = false; S.round = null; S.scene = S.setting === "journey" ? S.scene : S.setting; S.roundsHere = 0;
  $("over").hidden = true; $("menu").hidden = true; $("play").hidden = false; $("hud").hidden = false;
  updateHud(false);
  nextRound();
}
function showMenu(){
  moveToken++; S.dead = true;
  $("over").hidden = true; $("play").hidden = true; $("hud").hidden = true; $("menu").hidden = false;
  document.documentElement.style.setProperty("--accent", "#e8b44c");
  bestLine();
  $("start").focus({ preventScroll: true });
}

/* ---------- wiring ---------- */
svg = $("scene");
$("q").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".opt") : null;
  if(b && !b.disabled) return answer(+b.getAttribute("data-i"));
  if(e.target.id === "cont") next();
  if(e.target.id === "nextRound") nextRound();
});
svg.addEventListener("click", function(e){
  var n = e.target.closest ? e.target.closest(".node") : null;
  if(n && S.round){ S.inspect = n.getAttribute("data-id"); renderLedger(); }
});
svg.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var n = e.target.closest ? e.target.closest(".node") : null;
  if(n && S.round){ e.preventDefault(); S.inspect = n.getAttribute("data-id"); renderLedger(); }
});
document.addEventListener("keydown", function(e){
  if(e.ctrlKey || e.metaKey || e.altKey || $("play").hidden || !$("over").hidden) return;
  var k = +e.key;
  if(k >= 1 && k <= 4 && !S.answered){
    var b = $("q").querySelectorAll(".opt")[k - 1];
    if(b && !b.disabled){ e.preventDefault(); answer(k - 1); }
  }

$("start").addEventListener("click", startRun);
$("menuBtn").addEventListener("click", showMenu);
$("again").addEventListener("click", startRun);
$("toMenu").addEventListener("click", showMenu);

buildMenu();

  if(window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);

  document.documentElement.classList.add("solo");
}

})();
