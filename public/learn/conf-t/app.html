<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conf T</title>
<style>
:root{
  --bg:#0f0d16; --panel:#1a1724; --panel2:#241f33; --line:#3a3450;
  --text:#ece7da; --dim:#9a93ad; --accent:#ffd36a; --good:#7fcf86; --bad:#ec6f64; --teal:#4fd1c0;
  --font-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font-ui);padding:8px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:2200px;margin:0 auto}
/* objectives | game | slate, all one row: the side columns are filled by absolutely placed
   content, so only the game's aspect ratio sets the height and the three line up exactly */
.layout{display:grid;grid-template-columns:176px minmax(0,1fr) 300px;grid-template-areas:"side stage right";gap:8px;align-items:stretch}
/* never taller than the window, so on a big screen the game is as large as fits (standalone only:
   inside a frame, 100vh is the frame's own height) */
#stage{grid-area:stage;align-self:start}
.solo #stage{max-width:calc((100vh - 20px) * 1.667)}#side{grid-area:side}.right{grid-area:right;display:flex;flex-direction:column;gap:8px;min-width:0}

/* ---------- the game window ---------- */
#stage{position:relative;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#000;user-select:none}
#cv{display:block;width:100%;height:auto;aspect-ratio:320/192;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hearts{display:flex;gap:2px}
#hearts canvas{width:22px;height:22px;image-rendering:pixelated}
#marks,#place,#hint,#pname{font:600 .78rem var(--font-mono);color:var(--accent);background:rgba(15,13,22,.78);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
#place{position:absolute;left:8px;bottom:8px}
#pname{display:inline-block;margin-top:3px}
#pname:empty{display:none}
#hint{position:absolute;right:8px;bottom:8px;font-size:1rem;padding:8px 16px;cursor:pointer}
#hint:hover{border-color:var(--accent)}
#hint.note{font-size:.78rem;padding:2px 8px;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.el{position:absolute;transform:translate(-50%,-100%);font:.7rem/1.15 var(--font-ui);color:#fff;background:rgba(15,13,22,.86);border:1px solid var(--line);border-radius:3px;padding:2px 6px;max-width:190px;text-align:center}
.el.now{border-color:var(--accent);color:var(--accent)}
.el i{display:block;font:normal .62rem var(--font-mono);color:var(--accent)}
.tbar{position:absolute;height:6px;background:#000;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tbar b{display:block;height:100%;background:var(--good);transition:width .3s}
.tbar.low b{background:var(--bad)}
.tname{position:absolute;font:.65rem var(--font-ui);color:var(--dim);transform:translate(-50%,0)}
/* the question or objective you are working on, kept inside the game window */
#qbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 330px);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;background:rgba(10,8,16,.92);border:1px solid var(--accent);border-radius:6px;padding:6px 12px;pointer-events:none}
#qbar .qk{font:600 .66rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
#qbar .qt{font:600 1rem/1.3 var(--font-ui);color:var(--text)}
#qbar .qs{font:.75rem var(--font-mono);color:var(--dim)}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(15,13,22,.92);border:1px solid var(--accent);border-radius:6px;padding:6px 14px;font:600 .9rem var(--font-ui);color:var(--accent);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
#toast.bad{border-color:var(--bad);color:var(--bad)}

/* ---------- dialogue ---------- */
#dlg{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,13,22,.95);border:2px solid var(--line);border-radius:6px;padding:10px 14px 12px;min-height:84px}
#dname{font:600 .82rem var(--font-ui);color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
#dtext{font:1rem/1.45 var(--font-display);min-height:3em}
#dtext.nar{color:#cfc9de;font-style:italic}
#dnext{position:absolute;right:12px;bottom:6px;color:var(--accent);font-size:.8rem;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dchoices{display:grid;gap:6px;margin-top:8px}
.dc{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:.95rem var(--font-ui)}
.dc:hover,.dc:focus-visible{border-color:var(--accent)}
.dc kbd{font:.75rem var(--font-mono);color:var(--dim);margin-right:8px}

/* ---------- shop, title, ending ---------- */
.modal{position:absolute;inset:0;background:rgba(10,8,16,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:18px 20px;max-width:440px;width:100%}
.card h2{margin:0 0 4px;font:600 1.5rem var(--font-display)}
.card p{margin:0 0 12px;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--dim)}
.btn{color:var(--text);border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1c1405;font-weight:700}
#title{background:radial-gradient(ellipse at 50% 30%,#2a2440,#0b0912 70%)}
#title{overflow:hidden;align-items:flex-start;justify-content:flex-start}
#tcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.tcard{position:relative;max-width:520px;background:transparent;border:0;padding:clamp(14px,5%,40px)}
#title h1{font:600 clamp(2.2rem,8vw,3.6rem)/1 var(--font-display);margin:0 0 6px;letter-spacing:.02em}
#title .sub{margin:0 0 16px;color:#c3bdd4}
#title .btns{display:flex;gap:10px;flex-wrap:wrap}
#endcard h2{font-size:1.9rem}
#intro{padding:0;align-items:stretch;overflow:hidden;cursor:pointer;user-select:none}
#icv{position:absolute;left:0;top:0;width:100%;height:62%;object-fit:cover;object-position:50% 72%;image-rendering:pixelated;image-rendering:crisp-edges}
#iskip{position:absolute;top:10px;right:10px;font-size:.8rem;padding:4px 12px;background:rgba(15,13,22,.78)}
#iwords{position:absolute;left:0;right:0;top:6%;display:grid;gap:10px;justify-items:center;text-align:center}
#iwords div{display:grid;gap:2px}
#iwords small{font:.72rem var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#iwords b{font:600 clamp(1.8rem,6vw,3rem)/1 var(--font-mono);color:var(--text)}
#iwords .bad b{color:var(--bad)}
#ibox{position:absolute;left:0;right:0;bottom:0;height:38%;overflow:auto;background:#0a0810;border-top:2px solid var(--line);padding:14px 5% 16px;display:flex;align-items:center}
#itext p{margin:0 0 .6em;font:clamp(.95rem,2.2vw,1.12rem)/1.5 var(--font-display)}
#itext p:last-child{margin:0}
#itext p{animation:ifade .6s both}#itext p+p{animation-delay:.5s}
@keyframes ifade{from{opacity:0;transform:translateY(4px)}}
#inext{position:absolute;right:12px;bottom:6px;color:var(--accent);font-size:.8rem;animation:bob 1s infinite}
@media (prefers-reduced-motion:reduce){#itext p{animation:none}}
#create{align-items:flex-start;overflow:auto}
.creator{max-width:660px;margin:auto}
.creator h2{margin-bottom:12px}
.cr{display:grid;grid-template-columns:112px minmax(0,1fr);gap:20px;margin-bottom:12px}
.pv canvas{display:block;width:112px;height:112px;image-rendering:pixelated;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.cf{display:grid;gap:12px;min-width:0}
.fl{display:grid;gap:4px;font-size:.8rem;color:var(--dim)}
.fl input{font:600 1rem var(--font-mono);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:260px}
.seg{display:flex;gap:6px}
.seg button,.swt{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 12px;font-size:.85rem}
.seg button[aria-checked=true],.swt[aria-checked=true],.sw[aria-checked=true]{border-color:var(--accent);color:var(--accent)}
#swatches{display:grid;gap:8px}
.swrow{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:8px}
.swl{font-size:.8rem;color:var(--dim)}
.swgrp{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);padding:0}
.sw[aria-checked=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
@media (max-width:560px){#create,#intro{position:fixed;z-index:20;background:var(--bg)}.cr{grid-template-columns:minmax(0,1fr)}.pv canvas{width:80px;height:80px}.swrow{grid-template-columns:minmax(0,1fr)}}

/* ---------- terminal and side panel ---------- */
.termbox{background:#0b0912;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:300px;position:relative}
.tinner{position:absolute;inset:0;display:flex;flex-direction:column}
#ttabs{display:flex;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:38px;align-items:center}
.ttab{padding:3px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);font:.8rem var(--font-mono)}
.ttab[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.ttab.idle{opacity:.55}
#tlog{flex:1;min-height:0;overflow-y:auto;padding:6px 10px;font:400 12.5px/1.4 var(--font-mono);white-space:pre-wrap;word-break:break-all}
#tlog .in{color:#fff}
#tlog .sys{color:var(--accent)}
#tlog .dim{color:var(--dim)}
#tlog .good{color:var(--good)}
.tin{display:flex;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font:13px/1.4 var(--font-mono);background:#08060e}
.tin:focus-within{border-top-color:var(--accent)}
.tin .pr{color:var(--accent);white-space:pre}
.tin input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;outline:none;padding:0 0 0 .5ch}
.tin.off{opacity:.5}
#side{background:var(--panel);border:1px solid var(--line);border-radius:8px;position:relative;min-height:200px}
.sidein{position:absolute;inset:0;overflow:auto;padding:10px 11px}
#side h2{margin:0 0 6px;font:600 .7rem var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#goals{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
#goals li{position:relative;padding-left:20px;font-size:.82rem;line-height:1.3}
#goals li::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border:1.5px solid var(--dim);border-radius:3px}
#goals li.done{color:var(--dim);text-decoration:line-through}
#goals li.done::before{background:var(--good);border-color:var(--good)}
#slips{font:.78rem var(--font-mono);color:var(--dim);margin:0 0 6px}
#tip{margin:0;color:var(--dim);font-size:.78rem}

/* ---------- on-screen walking controls: touch devices only ---------- */
#pad{display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
@media (pointer:coarse){#pad{display:flex}}
#pad .keys{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:4px}
#pad .pk{border:1px solid var(--line);background:var(--panel2);border-radius:6px;color:var(--text);font-size:1rem;touch-action:none}
#pad .up{grid-column:2;grid-row:1}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}
#pad .act{width:96px;height:96px;border-radius:9px;border:1px solid var(--accent);background:var(--panel2);color:var(--accent);font:600 1.3rem var(--font-mono);touch-action:none}
@media (max-width:760px){#qbar{left:8px;right:8px;bottom:40px;transform:none;max-width:none;width:auto}#qbar .qt{font-size:.88rem}}
@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "right" "side"}
  #side{min-height:0}.sidein{position:static}
  .termbox{flex:none;height:300px;min-height:0}
}
</style>
</head>
<body>
<div class="shell"><div class="layout">
  <div id="stage">
    <canvas id="cv" width="320" height="192" role="img" aria-label="The game world, drawn in pixels. The story, the objectives and your slate are in text around it."></canvas>
    <div id="hud"><div><div id="hearts"></div><div id="pname"></div></div><div id="marks"></div></div>
    <div id="place"></div><button type="button" id="hint" tabindex="-1" hidden></button>
    <div id="labels"></div>
    <div id="qbar" hidden><span class="qk" id="qk"></span><span class="qt" id="qt"></span><span class="qs" id="qs"></span></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="dlg" hidden><div id="dname"></div><div id="dtext"></div><div id="dchoices"></div><div id="dnext" hidden>&#9660;</div></div>
    <div id="shop" class="modal" hidden><div class="card"><h2>Odo's cart</h2><p id="shopmarks"></p><div id="shoplist"></div><div class="row"><span></span><button class="btn" id="shopclose" type="button">Leave</button></div></div></div>
    <div id="title" class="modal"><canvas id="tcv" width="320" height="192" aria-hidden="true"></canvas><div class="card tcard"><h1>Conf T</h1><p class="sub">Say it exactly.</p><div class="btns"><button class="btn primary" id="btnNew" type="button">New game</button><button class="btn" id="btnCont" type="button" hidden>Continue</button><a class="btn" href="lab.html" style="text-decoration:none">Practice lab</a></div></div></div>
    <div id="intro" class="modal" hidden>
      <canvas id="icv" width="320" height="192" aria-hidden="true"></canvas>
      <button type="button" class="btn" id="iskip">Skip</button>
      <div id="iwords" hidden></div>
      <div id="ibox"><div id="itext"></div><span id="inext" aria-hidden="true">&#9660;</span></div>
    </div>
    <div id="create" class="modal" hidden><div class="card creator">
      <h2>Who are you?</h2>
      <div class="cr">
        <div class="pv"><canvas id="pvcv" width="16" height="16" aria-label="Preview of your character" role="img"></canvas></div>
        <div class="cf">
          <label class="fl">Name<input id="nameIn" type="text" maxlength="14" value="Wren" autocomplete="off" spellcheck="false"></label>
          <div class="fl">Addressed as<div class="seg" id="segTitle" role="radiogroup" aria-label="Addressed as"><button type="button" role="radio" data-v="Mister">Mister</button><button type="button" role="radio" data-v="Miss">Miss</button></div></div>
          <div id="swatches"></div>
        </div>
      </div>
      <div class="row"><button class="btn" id="crBack" type="button">Back</button><button class="btn primary" id="crGo" type="button">Begin</button></div>
    </div></div>
    <div id="endmodal" class="modal" hidden><div class="card" id="endcard"><h2 id="endtitle"></h2><p id="endtext"></p><button class="btn primary" id="btnAgain" type="button">Back to the title</button></div></div>
  </div>

  <aside id="side"><div class="sidein"><h2 id="sidehead">Objectives</h2><ul id="goals"></ul><p id="slips"></p><p id="tip"></p></div></aside>

  <div class="right">
    <div id="pad" role="group" aria-label="Walking controls">
      <div class="keys">
        <button type="button" class="pk up" data-k="up" aria-label="Walk up">&#9650;</button>
        <button type="button" class="pk left" data-k="left" aria-label="Walk left">&#9664;</button>
        <button type="button" class="pk down" data-k="down" aria-label="Walk down">&#9660;</button>
        <button type="button" class="pk right" data-k="right" aria-label="Walk right">&#9654;</button>
      </div>
      <span></span>
      <button type="button" class="act" id="padE" aria-label="Interact">E</button>
    </div>
    <div class="termbox"><div class="tinner">
      <div id="ttabs"></div>
      <div id="tlog" role="log" aria-live="polite" aria-label="Slate"></div>
      <label class="tin off" id="tinrow"><span class="pr" id="tpr"></span><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="The slate"></label>
    </div></div>
  </div>
</div></div>

<script src="js/ios.js"></script>
<script src="js/net.js"></script>
<script src="js/l2.js"></script>
<script src="js/packs/basics.js"></script>
<script src="js/packs/vtp.js"></script>
<script src="js/packs/stp.js"></script>
<script src="js/game/art.js"></script>
<script src="js/game/title.js"></script>
<script src="js/game/maps.js"></script>
<script src="js/game/rooms.js"></script>
<script src="js/game/story.js"></script>
<script src="js/game/game.js"></script>
</body>
</html>
